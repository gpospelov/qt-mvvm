name: MacOS

# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  # `actions:write` permission is required to delete caches
  # See also: https://docs.github.com/en/rest/actions/cache?apiVersion=2022-11-28#delete-a-github-actions-cache-for-a-repository-using-a-cache-id
  actions: write
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ master, develop ]

jobs:

  build:

    runs-on: macos-latest
    strategy:
      max-parallel: 3

    env:
      CCACHE_CACHE_KEY: ${{ github.workflow }}-ccache

    steps:

    - name: Checkout code
      uses: actions/checkout@v6.0.2

    - name: Install dependencies
      run: |
        brew install cmake qt6 ccache
        echo "Qt6 is installed to"
        echo $QTDIR

    - name: Restore the ccache
      id: restore-ccache
      uses: actions/cache/restore@v5
      with:
        key: ${{ env.CCACHE_CACHE_KEY }}
        path: ${{ github.workspace }}/.ccache

    - name: Build
      env:
        CCACHE_DIR: $GITHUB_WORKSPACE/.ccache
        CCACHE_COMPRESS: "true"
        CCACHE_COMPRESSLEVEL: "6"
        CCACHE_MAXSIZE: "400M"
        QT_QPA_PLATFORM: offscreen
        CXX: clang++
        USE_CPP: 17
        CMAKE_CXX_STANDARD: 17
        LLVM_BC_GENERATOR: /usr/bin/clang++
        LDFLAGS: "-L/usr/local/opt/qt/lib"
        CPPFLAGS: "-I/usr/local/opt/qt/include"
      run: |
        echo 'export PATH="/usr/local/opt/qt/bin:$PATH"' >> /Users/runner/.bash_profile
        mkdir $GITHUB_WORKSPACE/build
        cd $GITHUB_WORKSPACE/build
        cmake -G Ninja -DCMAKE_MAKE_PROGRAM=ninja -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/usr/local/opt/qt ../
        cmake --build . --config Release -j4

    - name: Delete the previously saved ccache
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      if: steps.restore-ccache.outputs.cache-hit == 'true'
      run: |
        caches=$(gh cache list --key ${{ env.CCACHE_CACHE_KEY }} --ref ${{ github.ref }} --json id,ref,key)
        caches_length=$(jq length <<< "$caches")
        if [ $caches_length -gt 0 ]; then
          echo "Deleting saved ccache keys..."
          gh cache delete ${{ env.CCACHE_CACHE_KEY }} --ref ${{ github.ref }}
        else
          echo "No saved ccache keys for deleting."
        fi

    - name: Save the ccache
      if: always()
      uses: actions/cache/save@v5
      with:
        key: ${{ env.CCACHE_CACHE_KEY }}
        path: ${{ github.workspace }}/.ccache

    - name: Test
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        cd $GITHUB_WORKSPACE/build
        echo Running tests...
        ctest -j --quiet --output-on-failure
        echo Testing finished.

    - name: Upload test logs
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: TestReport.log
        path: ./build/Testing/Temporary/LastTest.log
        retention-days: ${{ case(github.retention_days < 7, github.retention_days, 7) }}
        overwrite: true
